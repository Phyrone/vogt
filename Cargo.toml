[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Phyrone <phyrone@phyrone.de>"]
license = "MIT"
repository = "https://github.com/Phyrone/vogt"

[workspace.dependencies]
# no network transports yet: they pull in OpenSSL and libssh2
git2 = { version = "0.20", default-features = false }
vogt-macros = { path = "crates/vogt-macros" }
# the version tauri-plugin-sql uses, to share its connection pool
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "macros"] }
notify = "8"
# tauri runs on tokio; the index workers need its notifications and timers,
# and the tests its runtime and `#[tokio::test]`
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# the types that cross into the webview are generated from the Rust structs
ts-rs = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2.12.3" }
tauri-build = { version = "2.7.2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-sql = { version = "2.5.0", features = [ "sqlite" ] }
tauri-plugin-updater = "2"

[profile.dev]
incremental = true

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true

# macOS 26+ dyld rejects Mach-O images whose LC_SYMTAB string pool is not
# 8-byte aligned, and this toolchain's strip pass lays sqlx-macros' pool out
# 4-byte aligned, so the proc-macro dylib cannot be loaded while compiling
# sqlx. The dylib is build-time only, so leaving it unstripped ships nothing.
[profile.release.package.sqlx-macros]
strip = "none"
