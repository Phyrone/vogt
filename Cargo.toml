[workspace]
resolver = "3"
members = ["src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Phyrone <phyrone@phyrone.de>"]
license = "MIT"
repository = "https://github.com/Phyrone/vogt"

[workspace.dependencies]
nanoid = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2.12.3" }
tauri-build = { version = "2.7.2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.1"

[profile.dev]
incremental = true

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
