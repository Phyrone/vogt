# SQL goes through the `sqlx::query!` family of macros, which check every
# query against the schema at compile time (see AGENTS.md). The functions
# and `Executor` methods below take a string built at run time instead, so
# they are refused; a call that really needs one allows the lint on the
# smallest item, saying why. The macros' own output calls `Query::execute`
# and the like, not `Executor`'s methods, so it is not caught.
disallowed-methods = [
  { path = "sqlx::query", reason = "use sqlx::query! so the query is checked against the schema" },
  { path = "sqlx::query_with", reason = "use sqlx::query! so the query is checked against the schema" },
  { path = "sqlx::query_as", reason = "use sqlx::query_as! so the query is checked against the schema" },
  { path = "sqlx::query_as_with", reason = "use sqlx::query_as! so the query is checked against the schema" },
  { path = "sqlx::query_scalar", reason = "use sqlx::query_scalar! so the query is checked against the schema" },
  { path = "sqlx::query_scalar_with", reason = "use sqlx::query_scalar! so the query is checked against the schema" },
  { path = "sqlx::raw_sql", reason = "use the sqlx::query! macros so the query is checked against the schema" },
  { path = "sqlx::QueryBuilder::new", reason = "use the sqlx::query! macros so the query is checked against the schema" },
  { path = "sqlx::QueryBuilder::with_arguments", reason = "use the sqlx::query! macros so the query is checked against the schema" },
  { path = "sqlx::Executor::execute", reason = "call .execute(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::execute_many", reason = "call .execute(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::fetch", reason = "call .fetch(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::fetch_many", reason = "call .fetch(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::fetch_all", reason = "call .fetch_all(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::fetch_one", reason = "call .fetch_one(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::fetch_optional", reason = "call .fetch_optional(executor) on a sqlx::query! macro instead" },
  { path = "sqlx::Executor::prepare", reason = "use the sqlx::query! macros so the query is checked against the schema" },
  { path = "sqlx::Executor::prepare_with", reason = "use the sqlx::query! macros so the query is checked against the schema" },
]
