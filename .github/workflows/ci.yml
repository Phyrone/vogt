name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Formatting and lint findings fail the run on main and only warn everywhere else
  LENIENT: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    # A pull request from a branch of this repository is already covered by its push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prettier
        id: prettier
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: pnpm exec prettier --check .
      - name: Warn about formatting
        if: steps.prettier.outcome == 'failure'
        run: echo "::warning title=Prettier::Some files are not formatted. Run 'pnpm format'. This fails on main."

      - name: ESLint
        id: eslint
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: pnpm exec eslint .
      - name: Warn about lint findings
        if: steps.eslint.outcome == 'failure'
        run: echo "::warning title=ESLint::ESLint reported errors, see the ESLint step. This fails on main."

      - name: rustfmt
        id: rustfmt
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Warn about Rust formatting
        if: steps.rustfmt.outcome == 'failure'
        run: echo "::warning title=rustfmt::Rust code is not formatted. Run 'cargo fmt' in src-tauri. This fails on main."

  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri embeds the frontend at compile time, so it has to exist before cargo runs
      - name: Build the frontend
        run: pnpm vite:build
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests with coverage
        run: pnpm test:unit --run
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: pnpm test:e2e

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
