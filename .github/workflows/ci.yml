name: CI

on:
  push:
    # a tag is checked by the release workflow, which calls this one
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Formatting and lint findings fail the run on main and on a release tag, and only warn everywhere else
  LENIENT: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    # A pull request from a branch of this repository is already covered by its push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prettier
        id: prettier
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: pnpm exec prettier --check .
      - name: Warn about formatting
        if: steps.prettier.outcome == 'failure'
        run: echo "::warning title=Prettier::Some files are not formatted. Run 'pnpm format'. This fails on main."

      - name: ESLint
        id: eslint
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: pnpm exec eslint .
      - name: Warn about lint findings
        if: steps.eslint.outcome == 'failure'
        run: echo "::warning title=ESLint::ESLint reported errors, see the ESLint step. This fails on main."

      - name: rustfmt
        id: rustfmt
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: cargo fmt --all --check
      - name: Warn about Rust formatting
        if: steps.rustfmt.outcome == 'failure'
        run: echo "::warning title=rustfmt::Rust code is not formatted. Run 'cargo fmt'. This fails on main."

  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

  rust:
    name: Rust (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Tauri embeds the frontend at compile time, so it has to exist before cargo runs
      - name: Build the frontend
        run: pnpm vite:build

      - name: cargo check
        run: cargo check --workspace --locked --all-targets

      - name: Clippy
        id: clippy
        continue-on-error: ${{ fromJSON(env.LENIENT) }}
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Warn about Clippy findings
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: echo "::warning title=Clippy::Clippy reported findings on ${{ matrix.name }}, see the Clippy step. This fails on main."

      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-report-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests with coverage
        run: pnpm test:unit --run
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: pnpm test:e2e

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
