name: Pages

# Publishes the site at https://vogt.phyrone.de: the update manifests under
# /updates/ so far, one per channel. Every shipped build reads them from
# there, so that path must never move. The root is free for a landing page.
on:
  release:
    # a release that is withdrawn takes its channels back to the one before it
    types: [published, unpublished, deleted]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A release event runs on its tag, and the github-pages environment deploys
  # only from the default branch, so the event starts this workflow again there.
  restart:
    name: Run on ${{ github.event.repository.default_branch }}
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}

  deploy:
    name: Deploy
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Every deployment replaces the whole site, so the manifests are written
      # again from the releases each time. A landing page is built into site/
      # before this step.
      - name: Write the update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p site/updates
          gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.draft | not) | {tag: .tag_name, prerelease, published_at}' |
            jq -s 'sort_by(.published_at) | reverse' > releases.json

          # The channel follows the release published last, not the highest
          # version. A release without a manifest is passed over.
          manifest() { # channel, the jq filter for its releases
            for tag in $(jq -r ".[] | $2 | .tag" releases.json); do
              if gh release download "$tag" --pattern latest.json --output "site/updates/$1.json"; then
                echo "- \`$1\` is at $tag" >> "$GITHUB_STEP_SUMMARY"
                return
              fi
            done
            echo "::warning::No published release carries a manifest for the $1 channel"
          }
          manifest stable 'select(.prerelease | not)'
          # a full release lands on beta as well
          manifest beta .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
