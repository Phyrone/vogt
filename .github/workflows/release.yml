name: Release

# Pushing a tag builds the bundles into a draft release: v<version> the stable
# app as a release, v<version>-beta the beta app as a prerelease. Publishing
# that draft by hand is what ships it: only then does pages.yml move the
# channel to it.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # The beta of a version carries that version itself: the two are
      # separate apps, so nothing has to tell their versions apart.
      - name: The tag matches the three versions
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-beta) channel=beta version="${version%-beta}" ;;
            *-*)
              echo "::error::$GITHUB_REF_NAME is neither v<version> nor v<version>-beta"
              exit 1
              ;;
            *) channel=stable ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          declared() { # file, the version it declares
            [ "$2" = "$version" ] && return
            echo "::error file=$1::$1 declares $2, the tag says $version"
            exit 1
          }
          declared package.json "$(jq -r .version package.json)"
          declared src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          declared Cargo.toml "$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "vogt") | .version')"

      # one draft for every build to upload into; a re-run finds it again
      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          # pages.yml tells the channels apart by this flag
          PRERELEASE: ${{ steps.tag.outputs.channel == 'beta' }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="VOGT $GITHUB_REF_NAME" \
              -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true \
              --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle
    needs: [ci, prepare]
    permissions:
      contents: write
    uses: ./.github/workflows/bundle.yml
    secrets: inherit
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
      tag: ${{ github.ref_name }}
      channel: ${{ needs.prepare.outputs.channel }}
